:root {
  /* ---- Brand ---------------------------------------------------------- */
  --primary:          #494fdf;   /* cobalt violet — the only brand stamp   */
  --primary-bright:   #4f55f1;   /* inline link / accent-photo headers     */
  --primary-deep:     #3a40c4;   /* pressed/active cobalt                   */
  --on-primary:       #ffffff;

  /* ---- Canvas / Surface ---------------------------------------------- */
  --canvas-light:     #ffffff;   /* white catalogue mode                   */
  --canvas-dark:      #000000;   /* TRUE black storytelling canvas         */
  --surface-soft:     #f4f4f4;   /* off-white tiles, soft buttons          */
  --surface-card:     #ffffff;   /* feature cards on light                  */
  --surface-deep:     #0a0a0a;   /* inset cards inside dark regions         */
  --surface-elevated: #16181a;   /* plan cards lifted off black            */

  /* ---- Hairlines / Dividers ------------------------------------------ */
  --hairline-light:   #e2e2e7;
  --hairline-dark:    rgba(255,255,255,0.12);
  --hairline-strong:  #191c1f;
  --divider-soft:     rgba(255,255,255,0.06);

  /* ---- Text ----------------------------------------------------------- */
  --ink:              #191c1f;   /* primary text on light (warm black)     */
  --body:             #1f2226;
  --charcoal:         #3a3d40;
  --mute:             #505a63;
  --ash:              #5c5e60;
  --stone:            #8d969e;
  --faint:            #c9c9cd;
  --on-dark:          #ffffff;
  --on-dark-mute:     rgba(255,255,255,0.72);

  /* ---- Accent palette (ILLUSTRATIONS ONLY — never button surfaces) --- */
  --accent-teal:        #00a87e;
  --accent-light-blue:  #007bc2;
  --accent-blue-link:   #376cd5;
  --accent-light-green: #428619;
  --accent-green-text:  #006400;
  --accent-yellow:      #b09000;
  --accent-warning:     #ec7e00;
  --accent-pink:        #e61e49;
  --accent-danger:      #e23b4a;
  --accent-deep-red:    #8b0000;
  --accent-brown:       #936d62;
  --link:               #376cd5;

  /* ---- Type families -------------------------------------------------- */
  --font-display: "General Sans", "Aeonik Pro", "Inter Display", "Inter", system-ui, sans-serif;
  --font-body:    "Inter", system-ui, -apple-system, sans-serif;

  /* ---- Radii ---------------------------------------------------------- */
  --r-none: 0px;
  --r-sm:   8px;
  --r-md:   12px;
  --r-lg:   20px;
  --r-xl:   28px;
  --r-full: 9999px;

  /* ---- Spacing (base 4) ----------------------------------------------- */
  --sp-xxs: 4px;
  --sp-xs:  6px;
  --sp-sm:  8px;
  --sp-md:  14px;
  --sp-lg:  16px;
  --sp-xl:  24px;
  --sp-xxl: 32px;
  --sp-xxxl:48px;
  --sp-block:   80px;
  --sp-section: 88px;
  --sp-band:    120px;
}

/* ============================================================================
   TYPOGRAPHY — semantic scale
   Display = General Sans (Aeonik sub) 500, tight tracking that scales w/ size.
   Body    = Inter 400, positive tracking on UI labels.
   ============================================================================ */

/* base reset for specimens */
.t-display-xxl,.t-display-xl,.t-display-lg,.t-display-md,
.t-heading-lg,.t-heading-md,.t-heading-sm,
.t-button-lg { font-family: var(--font-display); font-weight: 500; }

.t-body-lg,.t-body-md,.t-body-md-bold,.t-body-sm,
.t-button-md,.t-button-sm,.t-caption,.t-link-emph { font-family: var(--font-body); }

.t-display-xxl { font-size: 136px; line-height: 1.0;  letter-spacing: -2.72px; }
.t-display-xl  { font-size: 80px;  line-height: 1.0;  letter-spacing: -0.8px; }
.t-display-lg  { font-size: 48px;  line-height: 1.21; letter-spacing: -0.48px; }
.t-display-md  { font-size: 40px;  line-height: 1.2;  letter-spacing: -0.4px; }
.t-heading-lg  { font-size: 32px;  line-height: 1.19; letter-spacing: -0.32px; }
.t-heading-md  { font-size: 24px;  line-height: 1.33; letter-spacing: 0; }
.t-heading-sm  { font-size: 20px;  line-height: 1.4;  letter-spacing: 0; }

.t-body-lg      { font-size: 18px; font-weight: 400; line-height: 1.56; letter-spacing: -0.09px; }
.t-body-md      { font-size: 16px; font-weight: 400; line-height: 1.5;  letter-spacing: 0.24px; }
.t-body-md-bold { font-size: 16px; font-weight: 600; line-height: 1.5;  letter-spacing: 0.16px; }
.t-body-sm      { font-size: 14px; font-weight: 400; line-height: 1.43; }

.t-button-lg { font-size: 20px; font-weight: 500; line-height: 1.4; }
.t-button-md { font-size: 16px; font-weight: 600; line-height: 1.5;  letter-spacing: 0.24px; }
.t-button-sm { font-size: 14px; font-weight: 600; line-height: 1.43; }
.t-caption   { font-size: 13px; font-weight: 400; line-height: 1.4; }
.t-link-emph { font-size: 16px; font-weight: 700; line-height: 1.5;  letter-spacing: 0.24px; }

/* ----------------------------------------------------------------------------
   Semantic element defaults — opt-in by wrapping content in .a4-prose
   or applying directly. Mirrors the marketing canvas hierarchy.
   ---------------------------------------------------------------------------- */
.a4-prose h1 { font-family: var(--font-display); font-weight: 500; font-size: 80px;
  line-height: 1.0; letter-spacing: -0.8px; color: var(--ink); margin: 0 0 var(--sp-xl); }
.a4-prose h2 { font-family: var(--font-display); font-weight: 500; font-size: 48px;
  line-height: 1.21; letter-spacing: -0.48px; color: var(--ink); margin: 0 0 var(--sp-lg); }
.a4-prose h3 { font-family: var(--font-display); font-weight: 500; font-size: 32px;
  line-height: 1.19; letter-spacing: -0.32px; color: var(--ink); margin: 0 0 var(--sp-md); }
.a4-prose h4 { font-family: var(--font-display); font-weight: 500; font-size: 24px;
  line-height: 1.33; color: var(--ink); margin: 0 0 var(--sp-sm); }
.a4-prose p  { font-family: var(--font-body); font-weight: 400; font-size: 18px;
  line-height: 1.56; letter-spacing: -0.09px; color: var(--body); margin: 0 0 var(--sp-lg); }
.a4-prose a  { color: var(--link); text-decoration: none; }
.a4-prose a:hover { text-decoration: underline; }
.a4-prose small { font-family: var(--font-body); font-size: 13px; line-height: 1.4; color: var(--ash); }

/* dark-mode prose */
.a4-prose--dark h1,.a4-prose--dark h2,.a4-prose--dark h3,.a4-prose--dark h4 { color: var(--on-dark); }
.a4-prose--dark p { color: var(--on-dark-mute); }
.a4-prose--dark a { color: var(--primary-bright); font-weight: 700; }
</style>
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html, body { margin: 0; background: #000; }
  body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--primary); color: #fff; }
  img { max-width: 100%; }

  @keyframes a4rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes a4grow { from { width: 0%; } to { width: 100%; } }
  @media (max-width: 420px) { .pm-steplabel { display: none; } }

  @media (max-width: 820px) {
    .lp-grid { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 440px) {
    .lp-tiers { grid-template-columns: 1fr !important; }
    .a4-navlinks { display: none !important; }
  }
  .lucide { display: block; }
</style>
